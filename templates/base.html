<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Applies the saved/system theme before first paint, so there's no
       flash of the wrong theme while the page loads. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("minto-theme");
        var theme = stored || (
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        );
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <title>{% block title %}Minto{% endblock %}</title>

  <!-- Minto theme-aware favicon -->
  <link
    id="minto-favicon"
    rel="icon"
    type="image/svg+xml"
    href="{{ url_for('static', filename='favicon-light.svg') }}?v={{ asset_version }}"
  >
  <script>
    (function () {
      function setFavicon(theme) {
        var favicon = document.getElementById("minto-favicon");
        if (!favicon) return;
        favicon.href = theme === "dark"
          ? "{{ url_for('static', filename='favicon-dark.svg') }}?v={{ asset_version }}"
          : "{{ url_for('static', filename='favicon-light.svg') }}?v={{ asset_version }}";
      }

      try {
        setFavicon(document.documentElement.getAttribute("data-theme") || "light");
      } catch (e) {}
    })();
  </script>

  <!-- Installable app (Add to Home Screen) -->
  <link rel="manifest" href="{{ url_for('web_manifest') }}">
  <meta name="theme-color" content="#1F6F50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Minto">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      /* Ink (text) */
      --text: #17181d;
      --text-secondary: #43454c;
      --nav-text: #5c5e68;
      --muted: #6f7180;
      --muted-2: #9a9ba6;

      /* Lines */
      --border: #e4e1d9;
      --border-strong: #d8d4c8;

      /* Surfaces — warm paper, not cold grey */
      --surface: #ffffff;
      --surface-translucent: rgba(255, 255, 255, 0.94);
      --surface-alt: #f3f1ea;
      --surface-subtle: #f7f5f0;
      --surface-subtle-border: #ece9e0;
      --input-bg: #f6f4ee;
      --nav-hover-bg: #eeece3;

      --background: #fbfaf7;
      --bg-gradient-1: #ffffff;
      --bg-gradient-2: #fbfaf7;
      --bg-gradient-3: #f3f1ea;

      /* Neutral UI chrome (buttons, active chips) */
      --primary: #17181d;
      --primary-hover: #2b2d34;
      --primary-contrast: #fbfaf7;

      /* The one bold color in the system — money moving in your favor */
      --positive: #1f6f50;
      --negative: #a83b32;
      --warning: #b8862f;
      --info: #3b6ea5;

      --danger-bg: #f7ece9;
      --danger-bg-alt: #fbf4f2;
      --danger-border: #e8c4bc;

      --hairline: rgba(23, 24, 29, 0.08);
      --shadow-soft: rgba(23, 24, 29, 0.05);
      --shadow-card: rgba(23, 24, 29, 0.08);
      --shadow-lift: rgba(23, 24, 29, 0.16);
      --ring: rgba(31, 111, 80, 0.16);
      --chip-shadow: rgba(23, 24, 29, 0.14);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    [data-theme="dark"] {
      --text: #f3f1ea;
      --text-secondary: #c9c6bc;
      --nav-text: #adaa9f;
      --muted: #9c9a8e;
      --muted-2: #6e6c63;

      --border: #2b2c30;
      --border-strong: #3c3d42;

      --surface: #1d1e22;
      --surface-translucent: rgba(29, 30, 34, 0.94);
      --surface-alt: #26272c;
      --surface-subtle: #202124;
      --surface-subtle-border: #2c2d31;
      --input-bg: #202124;
      --nav-hover-bg: #26272c;

      --background: #121316;
      --bg-gradient-1: #181a1e;
      --bg-gradient-2: #121316;
      --bg-gradient-3: #0d0e10;

      --primary: #f3f1ea;
      --primary-hover: #e3e0d5;
      --primary-contrast: #17181d;

      --positive: #3fa980;
      --negative: #e2857a;
      --warning: #e0b25c;
      --info: #6fa0d8;

      --danger-bg: #2a1e1b;
      --danger-bg-alt: #241916;
      --danger-border: #4a2e27;

      --hairline: rgba(255, 255, 255, 0.08);
      --shadow-soft: rgba(0, 0, 0, 0.35);
      --shadow-card: rgba(0, 0, 0, 0.45);
      --shadow-lift: rgba(0, 0, 0, 0.5);
      --ring: rgba(63, 169, 128, 0.28);
      --chip-shadow: rgba(0, 0, 0, 0.4);
    }

    html {
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

      color: var(--text);
      background:
        radial-gradient(
          circle at top left,
          var(--bg-gradient-1) 0%,
          var(--bg-gradient-2) 45%,
          var(--bg-gradient-3) 100%
        );
      background-attachment: fixed;

      transition: background 0.25s ease, color 0.25s ease;

      -webkit-font-smoothing: antialiased;
    }

    /* Respect people who've asked their OS to cut down on motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    :focus-visible {
      outline: 2px solid var(--positive);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 56px;
    }

    /* ---------- Top nav ---------- */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;

      height: 64px;
      margin: 0 -20px 20px;
      padding: 0 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--surface-translucent);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid var(--hairline);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--text);
      text-decoration: none;

      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;

      display: block;
      object-fit: contain;
    }

    /* Two variants of the same logo — one drawn for a light background,
       one for a dark one — swapped purely with CSS based on the current
       theme, so the icon always has real contrast instead of one version
       going invisible against its own background. */
    .brand-icon-dark {
      display: none;
    }

    [data-theme="dark"] .brand-icon-light {
      display: none;
    }

    [data-theme="dark"] .brand-icon-dark {
      display: block;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 10px;
      padding-left: 10px;
      border-left: 1px solid var(--border);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-link {
      padding: 9px 11px;

      border-radius: 999px;

      color: var(--nav-text);
      text-decoration: none;

      font-size: 13.5px;
      font-weight: 600;

      transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-link:hover {
      background: var(--nav-hover-bg);
      color: var(--text);
    }

    /* Keep every top-bar label on one line */
    .nav-link,
    .mode-option,
    .brand {
      white-space: nowrap;
    }

    .nav-menu {
      position: relative;
    }

    .nav-menu > .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      z-index: 30;
      min-width: 170px;
      display: flex;
      flex-direction: column;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 28px var(--shadow-lift);
    }

    .nav-dropdown[hidden] {
      display: none;
    }

    .nav-dropdown a {
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .nav-dropdown a:hover {
      background: var(--nav-hover-bg);
    }

    .nav-dropdown a.active {
      color: var(--positive);
    }

    .nav-link.active {
      background: var(--surface-alt);
      color: var(--text);
    }

    .logout-link {
      color: var(--muted);
    }

    .nav-link.primary {
      background: var(--primary);
      color: var(--primary-contrast);
    }

    .nav-link.primary:hover {
      background: var(--primary-hover);
      color: var(--primary-contrast);
    }

    .mode-toggle {
      display: flex;
      padding: 3px;

      border-radius: 999px;
      background: var(--surface-alt);
    }

    .mode-option {
      padding: 7px 13px;

      border-radius: 999px;

      color: var(--muted);
      text-decoration: none;

      font-size: 12.5px;
      font-weight: 700;

      transition: background 0.15s ease, color 0.15s ease;
    }

    .mode-option.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 8px var(--shadow-card);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 42px;
      height: 42px;
      margin: 0;
      padding: 0;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: var(--surface);
      color: var(--nav-text);

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
    }

    .theme-toggle:hover {
      background: var(--nav-hover-bg);
      color: var(--text);
    }

    .theme-toggle:active {
      transform: scale(0.92);
    }

    .theme-toggle svg {
      display: block;
    }

    .about-icon {
      display: none;
      text-decoration: none;
    }

    .logout-icon {
      display: none;
      text-decoration: none;
    }

    .about-icon.active {
      color: var(--positive);
      border-color: var(--positive);
    }

    [data-theme="light"] .theme-toggle .icon-moon {
      display: none;
    }

    [data-theme="dark"] .theme-toggle .icon-sun {
      display: none;
    }


    /* ---------- Secondary context navigation ---------- */
    .context-nav {
      position: sticky;
      top: 64px;
      z-index: 45;
      display: flex;
      justify-content: center;
      margin: -20px -20px 24px;
      padding: 8px 20px;
      background: var(--surface-translucent);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--hairline);
    }
    .context-nav-inner {
      width: 100%;
      max-width: 1000px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .context-mode { margin: 0; }
    .context-info {
      position: absolute;
      right: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--nav-text);
      text-decoration: none;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .context-info.active, .context-info:hover {
      color: var(--positive);
      border-color: var(--positive);
      background: var(--surface-subtle);
    }

    /* ---------- Bottom tab bar (mobile only) ---------- */

    .tab-bar {
      display: none;
    }

    .tab-menu {
      display: none;
    }

    /* ---------- Flash messages ---------- */

    .flash {
      max-width: 680px;
      margin: 0 auto 20px;

      padding: 13px 16px;

      border: 1px solid var(--border);
      border-radius: var(--radius-md);

      background: var(--surface);

      color: var(--text-secondary);

      font-size: 13.5px;

      box-shadow: 0 6px 20px var(--shadow-soft);
    }

    /* ---------- Typography & forms ---------- */

    h1, h2, h3 {
      color: var(--text);
      letter-spacing: -0.4px;
      font-weight: 800;
    }

    p {
      color: var(--muted);
      line-height: 1.55;
    }

    a {
      color: var(--text);
    }

    form {
      width: 100%;
    }

    label {
      display: block;

      margin-top: 18px;
      margin-bottom: 7px;

      color: var(--text-secondary);

      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid var(--border);
      border-radius: var(--radius-sm);

      background: var(--input-bg);

      color: var(--text);

      font-family: inherit;
      font-size: 15px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    /* The native up/down spinner on number inputs looks out of place next
       to a custom ₹ symbol positioned over the field — every amount field
       in the app has one, so this is global rather than per-page. */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* The native calendar icon on date inputs renders dark by default in
       every browser — invisible against a dark-mode input without this. */
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
    }

    [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted-2);
    }

    input:focus,
    select:focus,
    textarea:focus {
      background: var(--surface);
      border-color: var(--positive);

      box-shadow:
        0 0 0 4px var(--ring);
    }

    button {
      width: 100%;

      margin-top: 20px;
      padding: 14px 16px;

      border: 0;
      border-radius: var(--radius-sm);

      background: var(--primary);
      color: var(--primary-contrast);

      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);

      transform: translateY(-1px);

      box-shadow:
        0 8px 20px var(--shadow-lift);
    }

    button:active {
      transform: translateY(0);
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 8px;
    }

    .chip {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: auto;

      margin: 0;

      padding: 10px 16px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: var(--input-bg);
      color: var(--nav-text);

      font-size: 13.5px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease,
        transform 0.15s ease;
    }

    .chip:hover {
      background: var(--surface-alt);
      border-color: var(--border-strong);
    }

    .chip:active {
      transform: scale(0.97);
    }

    .chip input {
      display: none;
    }

    .chip:has(input:checked) {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-contrast);

      box-shadow:
        0 4px 12px var(--chip-shadow);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > * {
      flex: 1;
    }

    /* Numbers should line up — every rupee figure in the app opts into
       tabular figures via this class instead of proportional ones. */
    .tnum {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    /* Compact header for tablet / landscape phone layouts. Some mobile browsers
       expose a wide CSS viewport even when the device is physically small, so
       this breakpoint intentionally starts above the normal phone breakpoint. */
    @media (max-width: 1200px) {
      .navbar {
        height: 56px !important;
        margin-bottom: 14px !important;
        padding: 0 12px !important;
      }

      .brand {
        font-size: 17px !important;
        gap: 7px !important;
      }

      .brand-icon {
        width: 30px !important;
        height: 30px !important;
      }

      .nav-right {
        gap: 6px !important;
      }

      .mode-toggle {
        padding: 2px !important;
      }

      .mode-option {
        padding: 6px 10px !important;
        font-size: 12px !important;
      }

      .user-avatar,
      .about-icon,
      .theme-toggle {
        width: 38px !important;
        height: 38px !important;
      }

      .about-icon svg,
      .theme-toggle svg {
        width: 18px !important;
        height: 18px !important;
      }
    }

    @media (max-width: 1200px) {
      .context-nav { top: 56px; }
    }

    @media (max-width: 880px) {

      .app-container {
        padding: 0 16px 96px;
      }

      .context-nav {
        margin: -14px -16px 18px;
        padding: 5px 12px;
      }
      .context-nav-inner { min-height: 40px; }
      .context-info { width: 38px; height: 38px; right: 4px; }

      .navbar {
        height: 60px;
        margin: 0 -16px 20px;
        padding: 0 12px 0 16px;
        gap: 8px;
      }

      .nav-left,
      .nav-right {
        min-width: 0;
      }

      .nav-left { flex: 1 1 auto; }
      .nav-right { flex: 0 0 auto; gap: 6px; }
      .brand { min-width: 0; }

      .brand {
        font-size: 17px;
        gap: 8px;
      }

      .brand-icon {
        width: 28px;
        height: 28px;
      }

      /* The primary destinations move down into the bottom tab bar on
         small screens instead of squeezing into the top row. */
      .nav-links {
        display: none;
      }

      .about-icon {
        display: flex;
      }

      /* The avatar takes the logout icon's place on small screens (Log Out
         is on the Profile page), so the top bar doesn't get any wider. */
      .user-avatar {
        width: 34px;
        height: 34px;
      }

      .user-avatar.static {
        display: none;
      }

      body.has-avatar .logout-icon {
        display: none;
      }

      .tab-bar {
        align-items: stretch;
      }

      .tab-menu {
        flex: 1;
        display: flex;
        align-items: stretch;
        position: relative;
        min-width: 0;
      }

      .tab-link {
        min-width: 0;
      }

      .tab-sheet {
        position: absolute;
        bottom: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%);
        min-width: 160px;

        display: flex;
        flex-direction: column;
        padding: 6px;

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: 0 8px 24px var(--shadow-lift);
      }

      .tab-sheet[hidden] {
        display: none;
      }

      .tab-sheet a {
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }

      .tab-sheet a.active {
        color: var(--positive);
      }

      .tab-sheet a:active {
        background: var(--nav-hover-bg);
      }

      .logout-text {
        display: none;
      }

      .logout-icon {
        display: flex;
      }

      .mode-toggle {
        padding: 2px;
        flex: 0 0 auto;
      }

      .mode-option {
        padding: 6px 9px;
        font-size: 11.5px;
      }

      .tab-bar {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;

        padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));

        background: var(--surface-translucent);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--hairline);
      }

      .tab-link {
        flex: 1;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 3px;

        margin: 0;
        padding: 7px 4px;
        border-radius: 12px;

        color: var(--muted);
        text-decoration: none;
        text-align: center;

        font-size: 10px;
        font-weight: 700;
        line-height: 1.2;

        transition: color 0.15s ease, background 0.15s ease;
      }

      .tab-link svg {
        width: 21px;
        height: 21px;
      }

      .tab-link.active {
        color: var(--positive);
      }

      .tab-link:active {
        background: var(--nav-hover-bg);
      }
