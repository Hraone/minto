{% extends "base.html" %}

{% block content %}

<style>
  .login-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .login-card {
    width: 100%;
    max-width: 430px;
    background: var(--surface-translucent);
    border: 1px solid var(--shadow-card);
    border-radius: 24px;
    padding: 42px;
    box-shadow: 0 20px 60px var(--shadow-card);
  }

  .login-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
  }

  .login-icon img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .login-icon .icon-dark { display: none; }
  [data-theme="dark"] .login-icon .icon-light { display: none; }
  [data-theme="dark"] .login-icon .icon-dark { display: block; }

  .login-header h2 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.7px;
    color: var(--text);
  }

  .login-header p {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .form-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-subtle);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
  }

  .form-group input::placeholder {
    color: var(--muted-2);
  }

  .form-group input:focus {
    background: var(--surface);
    border-color: var(--text);
    box-shadow: 0 0 0 4px var(--ring);
  }

  .login-button {
    margin-top: 4px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: var(--primary-contrast);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .login-button:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 8px 20px var(--shadow-lift);
  }

  .login-button:active {
    transform: translateY(0);
  }

  .bio-divider {
    margin: 18px 0 14px;
    text-align: center;
    color: var(--muted-2);
    font-size: 12px;
  }

  .bio-button {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .bio-button:active {
    opacity: 0.85;
  }

  .bio-error {
    margin: 10px 0 0;
    text-align: center;
    color: var(--negative);
    font-size: 13px;
  }

  .signup-text {
    text-align: center;
    margin: 25px 0 0;
    font-size: 14px;
    color: var(--muted);
  }

  .signup-text a {
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }

  .signup-text a:hover {
    text-decoration: underline;
  }

  @media (max-width: 500px) {
    .login-card {
      padding: 30px 24px;
      border-radius: 20px;
    }

    .login-header h2 {
      font-size: 26px;
    }
  }
</style>

<div class="login-wrapper">

  <div class="login-card">


<div class="login-header">
  <div class="login-icon">
    <img class="icon-light" src="{{ url_for('static', filename='logo-light.svg') }}?v={{ asset_version }}" alt="">
    <img class="icon-dark" src="{{ url_for('static', filename='logo-dark.svg') }}?v={{ asset_version }}" alt="">
  </div>
  <h2>Welcome back</h2>
  <p>Sign in to continue managing your finances</p>
</div>

<form method="post" class="login-form">

  <div class="form-group">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="you@example.com"
      autocomplete="email"
      required
    >
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >
  </div>

  <button type="submit" class="login-button">
    Log in
  </button>

</form>

<div id="bio-login" hidden>
  <div class="bio-divider">or</div>
  <button type="button" class="bio-button" id="bio-login-btn">Log in with Face ID or fingerprint</button>
  <p class="bio-error" id="bio-login-error" hidden></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
<script>
(function () {
  var wrap = document.getElementById("bio-login");
  var btn = document.getElementById("bio-login-btn");
  var err = document.getElementById("bio-login-error");
  if (!window.PublicKeyCredential || !window.supabase) return;
  wrap.hidden = false;

  function fail(msg) { err.textContent = msg; err.hidden = false; }

  btn.addEventListener("click", async function () {
    err.hidden = true;
    btn.disabled = true;
    try {
      var sb = window.supabase.createClient("{{ supabase_url }}", "{{ supabase_anon_key }}", {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false,
          experimental: { passkey: true }
        }
      });
      var res = await sb.auth.signInWithPasskey();
      if (res.error || !res.data || !res.data.session) {
        var code = res.error && (res.error.code || "");
        if (code === "passkey_disabled") fail("Face ID login is not available yet.");
        else if (code === "webauthn_credential_not_found") fail("No passkey found. Log in with your password, then enable Face ID on the About page.");
        else fail("Face ID login was cancelled or failed. Use your password instead.");
        btn.disabled = false;
        return;
      }
      var r = await fetch("{{ url_for('passkey_login') }}", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_token: res.data.session.access_token,
          refresh_token: res.data.session.refresh_token
        })
      });
      var out = await r.json();
      if (r.ok && out.redirect) { window.location.href = out.redirect; return; }
      fail(out.error || "Could not log in. Use your password instead.");
    } catch (e) {
      fail("Face ID login failed. Use your password instead.");
    }
    btn.disabled = false;
  });
})();
</script>

<p class="signup-text">
  Don't have an account?
  <a href="{{ url_for('signup') }}">Create one</a>
</p>


  </div>

</div>

{% endblock %}
