{% extends "base.html" %}
{% block title %}{{ trip.name }} Chat · Minto{% endblock %}
{% block content %}
<style>
.chat-wrap{width:calc(100% - 32px);max-width:900px;margin:8px auto 36px;min-width:0}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;margin-bottom:16px}
.chat-head>div{flex:1;min-width:0}
.chat-head h1{font-size:25px;margin:0;overflow-wrap:anywhere;word-break:normal}
.chat-head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.chat-head .mini-btn{flex:0 0 auto;width:auto;white-space:nowrap}
.chat-panel{height:min(68vh,680px);min-height:360px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;background:var(--surface-translucent);overflow:hidden;min-width:0}
.chat-history{flex:1;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain;padding:18px;display:flex;flex-direction:column;gap:12px}
.chat-message{max-width:min(82%,620px);min-width:0;align-self:flex-start;border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:var(--surface);overflow-wrap:anywhere;word-break:break-word}
.chat-message.mine{align-self:flex-end}
.chat-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:5px}
.chat-body{white-space:pre-wrap;line-height:1.45;font-size:14px;overflow-wrap:anywhere;word-break:break-word}
.chat-composer{border-top:1px solid var(--border);padding:12px;display:flex;align-items:flex-end;gap:10px;min-width:0;background:var(--surface-translucent);padding-bottom:max(12px,env(safe-area-inset-bottom))}
.chat-composer textarea{display:block;flex:1 1 auto;width:0;min-width:0;min-height:44px;max-height:130px;resize:vertical;margin:0}
.chat-composer button{flex:0 0 auto;width:auto;min-width:76px;margin:0;white-space:nowrap}
.chat-status{padding:7px 12px;color:var(--muted);font-size:12px;line-height:1.4;min-height:0;overflow-wrap:anywhere}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:24px}
.chat-load-older{align-self:center;width:auto;margin:0;padding:8px 12px}
@media(max-width:600px){
  .chat-wrap{width:calc(100% - 20px);margin:4px auto 16px}
  .chat-head{align-items:flex-start;gap:8px;margin-bottom:10px}
  .chat-head h1{font-size:19px;line-height:1.25}
  .chat-head p{font-size:12px}
  .chat-head .mini-btn{padding:8px 10px;font-size:12px}
  .chat-panel{height:min(calc(100dvh - 225px),68vh);min-height:240px;border-radius:12px}
  .chat-history{padding:10px;gap:9px}
  .chat-message{max-width:92%;padding:9px 10px}
  .chat-meta{font-size:10px}
  .chat-body{font-size:14px}
  .chat-composer{gap:7px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .chat-composer textarea{min-height:42px;max-height:110px;padding:10px;font-size:16px}
  .chat-composer button{min-width:64px;padding:10px 12px}
  .chat-status{padding:6px 10px}
}
@media(max-width:360px){
  .chat-head{flex-wrap:wrap}
  .chat-head>div{flex-basis:100%}
  .chat-head .mini-btn{margin-left:auto}
  .chat-panel{height:min(calc(100dvh - 245px),64vh)}
}
</style>
<div class="chat-wrap">
  <div class="chat-head">
    <div><h1>{{ trip.name }} · Chat</h1><p>Private conversation for current members of this trip</p></div>
    <a class="mini-btn" href="{{ url_for('trip_detail', trip_id=trip.id) }}">Back to trip</a>
  </div>
  <section class="chat-panel" aria-label="Trip chat">
    <div class="chat-history" id="chat-history" aria-live="polite" aria-label="Messages"><div class="chat-empty" id="chat-empty">Loading messages…</div></div>
    <div class="chat-status" id="chat-status" role="status"></div>
    <form class="chat-composer" id="chat-form">
      <label for="chat-input" style="position:absolute;left:-10000px">Message</label>
      <textarea id="chat-input" maxlength="4000" rows="1" placeholder="Write a message…" required></textarea>
      <button type="submit" id="chat-send">Send</button>
    </form>
  </section>
</div>
<script>
(() => {
  const apiUrl = {{ url_for('trip_chat_api', trip_id=trip.id)|tojson }};
  const currentUser = {{ session.get('user_id')|tojson }};
  const history = document.getElementById('chat-history');
  const status = document.getElementById('chat-status');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const send = document.getElementById('chat-send');
  const seen = new Set();
  let loading = false;
  let nextBefore = null;
  let nextBeforeId = null;
  let hasOlder = false;
  let unreadCount = 0;
  let markReadTimer = null;

  function renderMessage(message, prepend = false) {
    const key = String(message.id);
    if (seen.has(key)) return;
    seen.add(key);
    const empty = document.getElementById('chat-empty');
    if (empty) empty.remove();
    const article = document.createElement('article');
    article.className = 'chat-message' + (String(message.sender_user_id) === String(currentUser) ? ' mine' : '');
    const meta = document.createElement('div');
    meta.className = 'chat-meta';
    const sender = document.createElement('span');
    sender.textContent = message.sender_name || 'Trip member';
    const time = document.createElement('time');
    const parsed = new Date(message.created_at);
    time.dateTime = message.created_at || '';
    time.textContent = Number.isNaN(parsed.getTime()) ? '' : parsed.toLocaleString();
    meta.append(sender, time);
    const body = document.createElement('div');
    body.className = 'chat-body';
    body.textContent = message.body || '';
    article.append(meta, body);
    if (prepend) {
      const firstMessage = [...history.children].find(el => el.classList.contains('chat-message'));
      if (firstMessage) history.insertBefore(article, firstMessage);
      else history.appendChild(article);
    } else history.appendChild(article);
  }

  async function loadMessages(older = false, background = false) {
    if (loading) return;
    loading = true;
    const wasNearBottom = history.scrollHeight - history.scrollTop - history.clientHeight < 80;
    try {
      const url = new URL(apiUrl, window.location.origin);
      if (older && nextBefore) {
        url.searchParams.set('before', nextBefore);
        if (nextBeforeId) url.searchParams.set('before_id', nextBeforeId);
      }
      const response = await fetch(url, {
        credentials: 'same-origin',
        cache: 'no-store',
        headers: {'Accept': 'application/json'}
      });
      const raw = await response.text();
      let data;
      try { data = JSON.parse(raw); }
      catch (_) {
        throw new Error(response.status === 401 || response.redirected
          ? 'Your session may have expired. Sign in again and reopen this chat.'
          : 'Chat returned an unexpected response. Refresh the page and retry.');
      }
      if (!response.ok) throw new Error(data.error || 'Could not load messages.');
      const beforeHeight = history.scrollHeight;
      const oldTop = history.scrollTop;
      if (older) {
        [...data.messages].reverse().forEach(message => renderMessage(message, true));
        history.scrollTop = oldTop + history.scrollHeight - beforeHeight;
      } else {
        data.messages.forEach(message => renderMessage(message));
        if (!data.messages.length && !seen.size) {
          const empty = document.createElement('div');
          empty.id = 'chat-empty';
          empty.className = 'chat-empty';
          empty.textContent = 'No messages yet. Start the conversation.';
          history.appendChild(empty);
        }
        if (!background || wasNearBottom) history.scrollTop = history.scrollHeight;
      }
      if (older) {
        nextBefore = data.next_before || null;
        nextBeforeId = data.next_before_id || null;
      } else {
        nextBefore = data.next_before || null;
        nextBeforeId = data.next_before_id || null;
      }
      hasOlder = Boolean(data.has_more && nextBefore && nextBeforeId);
      unreadCount = Number(data.unread_count || 0);
      updateOlderButton();
      status.textContent = '';
      if (!background) markRead();
    } catch (error) {
      status.textContent = error.message || 'Chat could not be loaded. Please retry.';
      const empty = document.getElementById('chat-empty');
      if (empty && !seen.size) empty.textContent = 'Messages could not be loaded. Please retry.';
    } finally { loading = false; }
  }

  function updateOlderButton() {
    let button = document.getElementById('chat-load-older');
    if (hasOlder && !button) {
      button = document.createElement('button');
      button.type = 'button';
      button.id = 'chat-load-older';
      button.className = 'chat-load-older mini-btn';
      button.textContent = 'Load older messages';
      button.addEventListener('click', () => loadMessages(true));
      history.prepend(button);
    } else if (!hasOlder && button) {
      button.remove();
    }
  }

  async function markRead() {
    if (document.visibilityState !== 'visible') return;
    try {
      await fetch(apiUrl, {
        method: 'POST',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({action: 'mark_read'})
      });
    } catch (_) {}
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      loadMessages(false, true);
      markRead();
    }
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const body = input.value.trim();
    if (!body || send.disabled) return;
    send.disabled = true;
    status.textContent = 'Sending…';
    try {
      const response = await fetch(apiUrl, {
        method: 'POST',
        credentials: 'same-origin',
        cache: 'no-store',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({body})
      });
      const raw = await response.text();
      let data;
      try { data = JSON.parse(raw); }
      catch (_) {
        throw new Error(response.status === 401 || response.redirected
          ? 'Your session may have expired. Sign in again and reopen this chat.'
          : 'Chat returned an unexpected response. Your message was not confirmed as sent.');
      }
      if (!response.ok) throw new Error(data.error || 'Message could not be sent.');
      renderMessage(data.message);
      input.value = '';
      history.scrollTop = history.scrollHeight;
      status.textContent = '';
    } catch (error) {
      status.textContent = error.message || 'Message could not be sent. Please retry.';
    } finally { send.disabled = false; input.focus(); }
  });

  loadMessages();
  window.setInterval(() => loadMessages(false, true), 12000);
})();
</script>
{% endblock %}
