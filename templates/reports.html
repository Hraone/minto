{% extends "base.html" %}

{% block title %}Reports · Minto{% endblock %}

{% block content %}
<style>
  .reports-page {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  .reports-card {
    padding: 22px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface);
  }

  .reports-card h2 {
    margin: 0 0 6px;
    font-size: 20px;
    color: var(--text);
  }

  .reports-card h3 {
    margin: 0 0 12px;
    font-size: 15px;
    color: var(--text);
  }

  .reports-card p {
    margin: 0 0 16px;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .reports-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }

  .reports-preset {
    width: auto;
    margin: 0;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .reports-dates {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .reports-dates > div { min-width: 0; }

  @media (max-width: 420px) {
    .reports-dates { grid-template-columns: 1fr; }
  }

  .reports-dates label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .reports-dates input {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
  }

  .reports-download {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: var(--positive);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .reports-history {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .reports-history li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    font-size: 13.5px;
    color: var(--text);
  }

  .reports-history li + li {
    border-top: 1px solid var(--border);
  }

  .reports-history small {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted-2);
  }

  .reports-history a {
    flex: none;
    color: var(--positive);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }

  .reports-empty {
    margin: 0;
    font-size: 13.5px;
    color: var(--muted-2);
  }
</style>

<div class="reports-page">

  <div class="reports-card">
    <h2>Reports</h2>
    <p>Choose a date range and download a PDF report with your spending stats, category breakdown and charts.</p>

    <div class="reports-presets">
      <button type="button" class="reports-preset" data-preset="month">This month</button>
      <button type="button" class="reports-preset" data-preset="lastmonth">Last month</button>
      <button type="button" class="reports-preset" data-preset="30days">Last 30 days</button>
      <button type="button" class="reports-preset" data-preset="year">This year</button>
    </div>

    <form method="get" action="{{ url_for('download_report') }}" id="report-form" data-no-loader>
      <div class="reports-dates">
        <div>
          <label for="from">From</label>
          <input type="date" id="from" name="from" class="minto-date-input"
                 value="{{ default_from }}" autocomplete="off" required>
        </div>
        <div>
          <label for="to">To</label>
          <input type="date" id="to" name="to" class="minto-date-input"
                 value="{{ default_to }}" autocomplete="off" required>
        </div>
      </div>
      <button type="submit" class="reports-download">Download PDF Report</button>
    </form>
  </div>

  <div class="reports-card">
    <h3>Recent downloads</h3>
    <ul class="reports-history" id="report-history"></ul>
    <p class="reports-empty" id="report-history-empty" hidden>No reports yet.</p>
  </div>

</div>

<script>
(function () {
  var fromEl = document.getElementById("from");
  var toEl = document.getElementById("to");
  var list = document.getElementById("report-history");
  var empty = document.getElementById("report-history-empty");
  var form = document.getElementById("report-form");

  function iso(d) {
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  document.querySelectorAll(".reports-preset").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var now = new Date();
      var from, to = now;
      var p = btn.getAttribute("data-preset");
      if (p === "month") {
        from = new Date(now.getFullYear(), now.getMonth(), 1);
      } else if (p === "lastmonth") {
        from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        to = new Date(now.getFullYear(), now.getMonth(), 0);
      } else if (p === "30days") {
        from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
      } else {
        from = new Date(now.getFullYear(), 0, 1);
      }
      fromEl.value = iso(from);
      toEl.value = iso(to);
    });
  });

  function niceDate(s) {
    return window.formatMintoDate(s);
  }

  function render(items) {
    list.textContent = "";
    empty.hidden = items.length > 0;
    items.forEach(function (h) {
      var li = document.createElement("li");
      var info = document.createElement("div");
      info.textContent = niceDate(h.date_from) + " to " + niceDate(h.date_to);
      var small = document.createElement("small");
      var created = new Date(h.created_at);
      var when = window.formatMintoDate(created) + " " +
        created.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      small.textContent = h.row_count + " transactions, " + (h.file_format || "pdf").toUpperCase() + ", made " + when;
      info.appendChild(small);

      var a = document.createElement("a");
      a.href = "{{ url_for('download_report') }}?from=" + h.date_from + "&to=" + h.date_to;
      a.textContent = "Download again";
      a.setAttribute("data-no-loader", "");
      a.addEventListener("click", scheduleRefresh);

      li.appendChild(info);
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  function refresh() {
    fetch("{{ url_for('reports_history') }}", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (items) { if (items) render(items); })
      .catch(function () {});
  }

  // The file goes straight to the device and the page stays put, so the
  // history list is refreshed a moment after the download starts.
  function scheduleRefresh() { setTimeout(refresh, 1800); }
  form.addEventListener("submit", scheduleRefresh);

  // base.html defines formatMintoDate after this content block. Render the
  // initial server-provided history on window load so the date helper exists.
  window.addEventListener("load", function () {
    render({{ history|tojson }});
  }, { once: true });
})();
</script>
{% endblock %}
